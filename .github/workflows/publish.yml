name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1+; npm 12 also keeps `npm stage` on hand
      - run: npm install -g npm@12
      - run: npm install
      - run: npm run build
      # No token: npm signs in with the trusted publisher set up on npmjs.com,
      # which must allow direct `npm publish` (not only staging).
      - run: npm publish --provenance --access public
