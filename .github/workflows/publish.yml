name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # npm stage ships in npm 12, which needs Node 24.15+
      - run: npm install -g npm@12
      - run: npm install
      - run: npm run build
      # No token: npm signs in with the trusted publisher set up on npmjs.com,
      # which only allows staging. A maintainer approves the staged version
      # under Staged Packages on npmjs.com (or `npm stage approve <id>`), with 2FA.
      - run: npm stage publish --provenance --access public
